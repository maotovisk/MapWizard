name: MapWizard Pre-release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional custom pre-release tag (example: pre-20260217-hotfix1)"
        required: false
        default: ""
      version:
        description: "Optional custom pre-release version (example: 1.2.4-pre.20260217.1)"
        required: false
        default: ""
      retry_existing:
        description: "Rebuild and upload assets to an existing pre-release tag"
        type: boolean
        required: false
        default: false

jobs:
  prepare:
    name: Prepare Pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.metadata.outputs.should_release }}
      reason: ${{ steps.metadata.outputs.reason }}
      next_version: ${{ steps.metadata.outputs.next_version }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      target_sha: ${{ steps.metadata.outputs.target_sha }}
      is_retry: ${{ steps.metadata.outputs.is_retry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute tag/version metadata
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name || '' }}
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          INPUT_RETRY_EXISTING: ${{ github.event.inputs.retry_existing || 'false' }}
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          date_stamp="$(date -u +%Y%m%d)"
          default_tag_name="pre-${date_stamp}"

          # Every tag that carries a semver version: stable vX.Y.Z and plain
          # semver pre-releases such as 3.0.0-rc2. Tags like pre-YYYYMMDD do not
          # encode a version and are intentionally ignored (their versions never
          # exceed the stable-based auto line).
          all_versions="$(
            git tag -l \
              | sed -E 's/^v//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
              | sort -u || true
          )"

          latest_stable_base="$(
            printf '%s\n' "${all_versions}" \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n 1 || true
          )"

          latest_prerelease_base="$(
            printf '%s\n' "${all_versions}" \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-' \
              | sed -E 's/-.*$//' \
              | sort -V | tail -n 1 || true
          )"

          # An unreleased line is "in progress" when its base is newer than the
          # latest stable, e.g. 3.0.0-rc2 while the latest stable is v2.7.2.
          active_line=""
          if [[ -n "${latest_prerelease_base}" ]]; then
            newest_base="$(printf '%s\n%s\n' "${latest_stable_base:-0.0.0}" "${latest_prerelease_base}" | sort -V | tail -n 1)"
            if [[ "${newest_base}" == "${latest_prerelease_base}" && "${latest_prerelease_base}" != "${latest_stable_base}" ]]; then
              active_line="${latest_prerelease_base}"
            fi
          fi

          if [[ -n "${active_line}" ]]; then
            # Continue the in-progress line with a date-stamped release candidate.
            # The date keeps it ordering above the previous candidate
            # (3.0.0-rc3.20260917 > 3.0.0-rc2) while still allowing only one
            # pre-release per day; the tag always equals the version so the next
            # run can detect it again.
            escaped_line="${active_line//./\\.}"
            highest_pre="$(printf '%s\n' "${all_versions}" | grep -E "^${escaped_line}-" | sort -V | tail -n 1)"
            suffix="${highest_pre#${active_line}-}"
            rc_number=""

            if [[ "${suffix}" =~ ^rc([0-9]+)$ ]]; then
              # Manually cut candidate (e.g. rc2) -> start the next one (rc3).
              rc_number=$(( BASH_REMATCH[1] + 1 ))
            elif [[ "${suffix}" =~ ^rc([0-9]+)\. ]]; then
              # Date-stamped candidate (e.g. rc3.20260917) -> keep the same
              # candidate number and just refresh the date.
              rc_number="${BASH_REMATCH[1]}"
            else
              highest_rc="$(printf '%s\n' "${all_versions}" | grep -Eo "^${escaped_line}-rc[0-9]+" | grep -Eo '[0-9]+$' | sort -n | tail -n 1 || true)"
              rc_number=$(( ${highest_rc:-0} + 1 ))
            fi

            default_next_version="${active_line}-rc${rc_number}.${date_stamp}"
            default_tag_name="${default_next_version}"
          else
            if [[ -z "${latest_stable_base}" ]]; then
              latest_stable_base="0.1.0"
            fi

            IFS='.' read -r major minor patch <<< "${latest_stable_base}"
            next_patch=$((patch + 1))
            default_next_version="${major}.${minor}.${next_patch}-pre.${date_stamp}"
          fi

          tag_name="${default_tag_name}"
          next_version="${default_next_version}"
          target_sha="${GITHUB_SHA}"
          is_retry="false"
          trimmed_version=""

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            trimmed_tag_name="${INPUT_TAG_NAME#"${INPUT_TAG_NAME%%[![:space:]]*}"}"
            trimmed_tag_name="${trimmed_tag_name%"${trimmed_tag_name##*[![:space:]]}"}"
            trimmed_version="${INPUT_VERSION#"${INPUT_VERSION%%[![:space:]]*}"}"
            trimmed_version="${trimmed_version%"${trimmed_version##*[![:space:]]}"}"

            if [[ -n "${trimmed_tag_name}" ]]; then
              tag_name="${trimmed_tag_name}"
            fi

            if [[ -n "${trimmed_version}" ]]; then
              next_version="${trimmed_version}"
            fi
          fi

          if git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
            if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${INPUT_RETRY_EXISTING}" == "true" ]]; then
              should_release="true"
              reason="Retrying existing release for ${tag_name}."
              target_sha="$(git rev-parse "refs/tags/${tag_name}^{commit}")"
              is_retry="true"

              if [[ -z "${trimmed_version}" ]]; then
                release_name="$(gh release view "${tag_name}" --json name --jq .name)"
                if [[ "${release_name}" != "MapWizard pre-release "* ]]; then
                  echo "Existing release name does not contain a version; provide the version input." >&2
                  exit 1
                fi
                next_version="${release_name#MapWizard pre-release }"
              fi
            else
              should_release="false"
              reason="Skipping: tag ${tag_name} already exists."
            fi
          else
            should_release="true"
            reason="No existing tag for ${tag_name}."
          fi

          echo "next_version=${next_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "target_sha=${target_sha}" >> "$GITHUB_OUTPUT"
          echo "is_retry=${is_retry}" >> "$GITHUB_OUTPUT"
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

  build:
    name: Build for ${{ matrix.os }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install vpk CLI
        run: dotnet tool install -g vpk

      - name: Add .NET tools to PATH
        if: runner.os != 'Windows'
        run: echo "${HOME}/.dotnet/tools" >> $GITHUB_PATH

      - name: Add .NET tools to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test MapWizard.Tests/MapWizard.Tests.csproj --no-restore --verbosity normal

      - name: Make platform script executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x MapWizard.Desktop/build-linux.sh
          chmod +x MapWizard.Desktop/build-osx.sh
          chmod +x MapWizard.Desktop/build-win.sh

      - name: Build with Velopack - Linux
        if: runner.os == 'Linux'
        run: |
          cd MapWizard.Desktop
          ./build-linux.sh ${{ needs.prepare.outputs.next_version }}

      - name: Build with Velopack - macOS
        if: runner.os == 'macOS'
        run: |
          cd MapWizard.Desktop
          ./build-osx.sh ${{ needs.prepare.outputs.next_version }}

      - name: Build with Velopack - Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd MapWizard.Desktop
          build-win.bat ${{ needs.prepare.outputs.next_version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: MapWizard-Pre-${{ matrix.os }}
          path: |
            MapWizard.Desktop/releases/**/*

  release:
    name: Publish GitHub Pre-release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7

      - name: Create pre-release
        uses: softprops/action-gh-release@v3
        with:
          name: MapWizard pre-release ${{ needs.prepare.outputs.next_version }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          target_commitish: ${{ needs.prepare.outputs.target_sha }}
          draft: false
          prerelease: true
          files: |
            MapWizard-Pre-*/**/*
          fail_on_unmatched_files: true
          generate_release_notes: ${{ needs.prepare.outputs.is_retry != 'true' }}

  skipped:
    name: Skip Pre-release
    needs: prepare
    if: needs.prepare.outputs.should_release != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: echo "${{ needs.prepare.outputs.reason }}"
